[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-news-aggregater"
version = "2.0.0"
description = "AI-powered news aggregator that fetches from various sources, categorizes, and emails personalized digests"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "jinja2>=3.1.6",
    "feedparser>=6.0.12",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2024.7.25",
    "google-api-python-client>=2.134.0",
    "langchain-openai>=0.2.0",
    "langchain>=0.3.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=0.9.9",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.0",
    "redis>=5.0.0",
    "bs4>=0.0.2",
    "requests>=2.33.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
run-api = "app.api.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
