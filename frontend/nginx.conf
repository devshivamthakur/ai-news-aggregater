server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits hashed asset filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Optional: reverse-proxy API calls to FastAPI. The app normally talks to the
  # absolute VITE_API_URL, but this keeps relative /api/* calls working too.
  location /api/ {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA history fallback: deep links like /news or /admin resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
